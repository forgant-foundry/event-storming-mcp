name: release

# Push a semver tag (git tag v0.7.0 && git push origin v0.7.0) to build and
# publish binaries for every platform with GoReleaser.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # go.mod states the minimum Go; build and test with the latest stable
      # release so binaries get the newest standard-library security fixes.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
